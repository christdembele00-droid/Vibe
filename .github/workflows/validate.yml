name: Validate VIBE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check JSON files
        run: |
          node -e "for (const f of ['firebase.json','manifest.webmanifest']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON OK')"

      - name: Check frontend references
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const expected=[
            'vibe-persistence.js','vibe-runtime.js','vibe-seed.js','vibe-enhancements.js',
            'vibe-ai.js','calls.js','vibe-actions.js','vibe-online.js',
            'vibe-analytics.js','vibe-local-notifications.js','vibe-channel.js','vibe-modern.js',
            'style.css','vibe-actions.css','vibe-redesign.css','vibe-ui-cleanup.css',
            'vibe-modern.css','vibe-oled.css'
          ];
          for(const file of expected){
            if(!fs.existsSync(file)) throw new Error(`Missing file: ${file}`);
            if(!html.includes(file)) throw new Error(`Missing index.html reference: ${file}`);
          }
          if(!fs.existsSync('firebase-config.js')) throw new Error('Missing file: firebase-config.js');
          const forbidden=['vibe-navigation.js','vibe-spa.js','vibe-native-panels.js','vibe-fixes.js','vibe-core.js','vibe-navigation.css','vibe-spa.css','vibe-native-panels.css','vibe-fixes.css','vibe-core.css'];
          for(const file of forbidden){
            if(html.includes(file)) throw new Error(`Forbidden stale reference: ${file}`);
          }
          console.log('Frontend references OK');
          NODE

      - name: Check PWA cache references
        run: |
          node <<'NODE'
          const fs=require('fs');
          const sw=fs.readFileSync('sw.js','utf8');
          const required=[
            'vibe-persistence.js','vibe-runtime.js','vibe-seed.js','vibe-enhancements.js','vibe-ai.js',
            'vibe-local-notifications.js','vibe-actions.js','vibe-online.js','vibe-analytics.js',
            'vibe-channel.js','calls.js','vibe-modern.js','firebase-config.js','style.css',
            'vibe-actions.css','vibe-redesign.css','vibe-ui-cleanup.css','vibe-modern.css','vibe-oled.css',
            'manifest.webmanifest','icons/icon.svg'
          ];
          for(const file of required){
            if(!sw.includes(file)) throw new Error(`Missing PWA cache asset: ${file}`);
          }
          console.log('PWA cache references OK');
          NODE
