name: Build Vibe Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vibe
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle
        run: |
          set -e
          rm -rf www
          mkdir -p www
          rsync -a ./ www/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www'

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android version
        run: |
          set -e
          sed -i "0,/versionCode 1/s//versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i '0,/versionName "1.0"/s//versionName "1.0.0"/' android/app/build.gradle

      - name: Sync Vibe into Android
        run: npx cap sync android

      - name: Configure optional Play signing
        env:
          VIBE_KEYSTORE_BASE64: ${{ secrets.VIBE_KEYSTORE_BASE64 }}
          VIBE_KEYSTORE_PASSWORD: ${{ secrets.VIBE_KEYSTORE_PASSWORD }}
          VIBE_KEY_ALIAS: ${{ secrets.VIBE_KEY_ALIAS }}
          VIBE_KEY_PASSWORD: ${{ secrets.VIBE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$VIBE_KEYSTORE_BASE64" ]; then
            echo "$VIBE_KEYSTORE_BASE64" | base64 --decode > android/vibe-upload.jks
            test -s android/vibe-upload.jks
            {
              echo "VIBE_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/vibe-upload.jks"
              echo "VIBE_KEYSTORE_PASSWORD=$VIBE_KEYSTORE_PASSWORD"
              echo "VIBE_KEY_ALIAS=$VIBE_KEY_ALIAS"
              echo "VIBE_KEY_PASSWORD=$VIBE_KEY_PASSWORD"
            } >> android/gradle.properties
            sed -i '/^android {/a\    signingConfigs { release { storeFile file(project.findProperty("VIBE_KEYSTORE_PATH")); storePassword project.findProperty("VIBE_KEYSTORE_PASSWORD"); keyAlias project.findProperty("VIBE_KEY_ALIAS"); keyPassword project.findProperty("VIBE_KEY_PASSWORD") } }' android/app/build.gradle
            sed -i '/^    buildTypes {/a\        release { signingConfig signingConfigs.release }' android/app/build.gradle
            echo "VIBE_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "VIBE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Verify Android project
        working-directory: android
        run: ./gradlew tasks --no-daemon --stacktrace

      - name: Build release Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify Play Store bundle
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Android-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build debug APK for testing
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish signed bundle release
        if: env.VIBE_SIGNING_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            android/app/build/outputs/bundle/release/app-release.aab \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Vibe Android ${GITHUB_RUN_NUMBER}" \
            --notes "Version Android Vibe : App Bundle release pour Google Play et APK de test." \
            --prerelease
