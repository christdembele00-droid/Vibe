name: Build Vibe Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vibe
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle
        run: |
          rm -rf www
          mkdir www
          rsync -a ./ www/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='www'

      - name: Create Android project
        run: npx cap add android

      - name: Sync Vibe into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Vibe Android ${GITHUB_RUN_NUMBER}" \
            --notes "APK Android de Vibe généré automatiquement depuis la branche main." \
            --prerelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
