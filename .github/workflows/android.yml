name: Vibe Android Debug Build

on:
  push:
    branches: [main, architecture-foundation-v1]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vibe
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web and Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Stage web assets
        run: npm run prepare:web

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Google native authentication
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON_B64" || {
            echo "Missing GitHub secret FIREBASE_GOOGLE_SERVICES_JSON_B64."
            exit 1
          }
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          p = Path("android/variables.gradle")
          text = p.read_text(encoding="utf-8")
          additions = "    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'\n"
          if "rgcfaIncludeGoogle" not in text:
              text = text.replace("ext {", "ext {\n" + additions, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Configure Google services Gradle plugin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("android/build.gradle")
          s=p.read_text()
          if "com.google.gms:google-services:4.4.2" not in s:
              s=s.replace("dependencies {", 'dependencies {\n        classpath \'com.google.gms:google-services:4.4.2\'', 1)
          p.write_text(s)
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if "com.google.gms.google-services" not in s:
              s="apply plugin: 'com.google.gms.google-services'\n"+s
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Android-Debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
