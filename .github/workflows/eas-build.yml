name: Vibe EAS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/eas-build.yml'
  pull_request:
    types: [labeled]

jobs:
  build:
    if: github.event_name != 'pull_request' || startsWith(github.event.label.name, 'eas-build-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Select build profile
        id: profile
        shell: bash
        run: |
          PROFILE=production
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LABEL="${{ github.event.label.name }}"
            PROFILE="${LABEL#eas-build-android:}"
            if [ "$PROFILE" = "$LABEL" ]; then PROFILE="preview"; fi
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Build Android app with EAS
        run: eas build --platform android --profile ${{ steps.profile.outputs.profile }} --non-interactive
