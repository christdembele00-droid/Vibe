name: Vibe Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vibe
          POSTGRES_USER: vibe
          POSTGRES_PASSWORD: vibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibe -d vibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Vibe
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://vibe:vibe@127.0.0.1:5432/vibe
        run: python -m app.migrate

      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vibe
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Syntax-check legacy web modules
        shell: bash
        run: |
          set -e
          find . -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Install Next.js dependencies
        working-directory: frontend
        run: npm install

      - name: Build Next.js frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet
