name: Export Vibe Repository
on:
  push:
    paths:
      - '.github/workflows/export-vibe.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create repository archive
        run: git archive --format=zip --output=Vibe-full-repository.zip HEAD
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-full-repository
          path: Vibe-full-repository.zip
          retention-days: 1
