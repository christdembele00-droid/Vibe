name: Validate Vibe rules

on:
  push:
    branches:
      - main
    paths:
      - database.rules.json
      - firebase.json
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('database.rules.json','utf8')); if(!r || !r.rules || typeof r.rules !== 'object' || Array.isArray(r.rules)) process.exit(1); console.log('database.rules.json: OK')"

      - name: Validate Firebase config
        run: node -e "const fs=require('fs'); const f=JSON.parse(fs.readFileSync('firebase.json','utf8')); if(f.database?.rules !== 'database.rules.json') process.exit(1); console.log('firebase.json: OK')"
