name: Validate Firebase Realtime Database rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'firebase.json'

jobs:
  validate-rtdb-rules:
    name: Validate Realtime Database rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate rules JSON
        run: node -e "const fs=require('fs'); const p='database.rules.json'; const data=JSON.parse(fs.readFileSync(p,'utf8')); if(!data || typeof data.rules!=='object' || Array.isArray(data.rules)) throw new Error('database.rules.json doit contenir un objet rules'); console.log('Firebase Realtime Database rules JSON: OK');"

      - name: Verify Firebase project configuration
        run: node -e "const fs=require('fs'); const f=JSON.parse(fs.readFileSync('firebase.json','utf8')); if(!f.database || f.database.rules!=='database.rules.json') throw new Error('firebase.json ne référence pas database.rules.json'); console.log('Firebase configuration: OK');"

      - name: Report
        run: |
          echo "Firebase rules validation completed."
          echo "No FIREBASE_TOKEN, Google Cloud credentials, or deployment credentials are required."
          echo "Production publication remains managed from Firebase Console."