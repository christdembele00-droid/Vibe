services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vibe
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
    ports:
      - "5432:5432"
    volumes:
      - vibe_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vibe:vibe@postgres:5432/vibe
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  vibe_postgres_data:
