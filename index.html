<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><title>VIBE — Messagerie</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside><header><div class="brand"><b>V</b><strong>VIBE</strong></div><div class="head-actions"><button id="newChat" title="Nouvelle discussion">＋</button><button id="theme" title="Thème">◐</button></div></header><section id="auth"><h1>Bienvenue sur VIBE</h1><p>Une messagerie moderne, rapide et enrichie par Gemini.</p><button id="google">Continuer avec Google</button><button id="github">Continuer avec GitHub</button></section><section id="user" hidden><div class="me"><img id="meAvatar"><div><strong id="meName">Utilisateur</strong><small id="meStatus">🟢 En ligne</small></div><button id="profile">⚙</button></div><nav class="tabs"><button class="tab active" data-tab="chats">💬 Discussions</button><button class="tab" data-tab="stories">◉ Statuts</button></nav><input id="search" placeholder="Rechercher une personne ou discussion"><div id="contacts"></div><div id="stories" hidden></div><button id="logout">Se déconnecter</button></section></aside><main><header class="chathead"><button id="back" class="back">‹</button><img id="avatar"><div class="chat-title"><strong id="name">VIBE</strong><small id="status">Messagerie intelligente</small></div><div class="chat-actions"><button id="ai" title="Gemini">✨</button><button id="audioCall" title="Appel audio">📞</button><button id="videoCall" title="Appel vidéo">🎥</button><button id="chatMenu" title="Plus">⋮</button></div></header><div id="typing" hidden>écrit…</div><div id="messages"><div class="welcome"><b>V</b><h2>VIBE</h2><p>Connecte-toi puis sélectionne un utilisateur pour discuter en temps réel.</p></div></div><form id="composer" hidden><label class="attach" title="Photo ou fichier">📎<input id="file" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt" hidden></label><button type="button" id="emoji" title="Emoji">😊</button><input id="message" maxlength="4000" autocomplete="off" placeholder="Écrire un message…"><button id="mic" type="button" title="Message vocal">🎤</button><button type="submit" title="Envoyer">➤</button></form></main></div><dialog id="modal"><div id="modalContent"></div><button id="closeModal">Fermer</button></dialog><div id="toast"></div><script type="module" src="app.js"></script></body></html>
