<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff7a18">
  <meta name="description" content="Vibe — une messagerie moderne, rapide et privée.">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth-ui.css">
  <link rel="stylesheet" href="vibe-settings.css">
  <link rel="stylesheet" href="active-users.css">
  <title>Vibe — Messenger</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <header class="side-header">
        <a class="brand" href="#" aria-label="Vibe accueil"><img class="brand-icon" src="icon.svg" alt=""><span>Vibe</span></a>
        <div class="header-actions">
          <button class="glass-btn" id="newChatBtn" aria-label="Nouvelle discussion" title="Nouvelle discussion"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="glass-btn" id="menuBtn" aria-label="Menu" title="Paramètres"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
        </div>
      </header>
      <div class="search-box">
        <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>
        <input id="searchInput" type="search" placeholder="Rechercher une discussion ou un utilisateur" autocomplete="off">
        <kbd>⌘ K</kbd>
      </div>
      <nav class="main-tabs" aria-label="Navigation principale">
        <button class="tab active" data-view="chats"><svg viewBox="0 0 24 24"><path d="M5 6.5A3.5 3.5 0 0 1 8.5 3h7A3.5 3.5 0 0 1 19 6.5v5a3.5 3.5 0 0 1-3.5 3.5H11l-4.2 3v-3.3A3.5 3.5 0 0 1 5 11.5z"/></svg><span>Messages</span><b id="chatBadge"></b></button>
        <button class="tab" data-view="calls"><svg viewBox="0 0 24 24"><path d="M7.5 4.5 10 7l-1.7 2.5c.7 2.7 2.8 4.8 5.5 5.5l2.5-1.7 2.5 2.5-1.5 2.5c-.5.8-1.5 1.1-2.4.8A17.2 17.2 0 0 1 4.4 7.1c-.3-.9 0-1.9.8-2.4z"/></svg><span>Appels</span></button>
      </nav>
      <section class="conversation-list" id="activeUsersList" aria-label="Utilisateurs actifs"></section>
      <section class="conversation-list" id="conversationList" aria-label="Discussions"></section>
      <footer class="profile-bar">
        <div class="avatar avatar-user">V</div>
        <div class="profile-copy"><strong>Mon profil</strong><span>Se connecter</span></div>
        <button class="glass-btn" id="profileBtn" aria-label="Profil / connexion" title="Profil / connexion"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg></button>
      </footer>
    </aside>
    <main class="chat-panel" id="chatPanel">
      <section class="welcome" id="emptyState"><div class="welcome-orb"><img src="icon.svg" alt="Vibe"></div><p class="eyebrow">VIBE MESSENGER</p><h1>Vos conversations,<br><span>sans friction.</span></h1><p class="welcome-text">Une messagerie moderne, rapide et synchronisée sur tous vos écrans.</p><div class="welcome-chips"><span>Rapide</span><span>Privé</span><span>Synchronisé</span></div></section>
      <section class="chat-view hidden" id="chatView">
        <header class="chat-header"><button class="back-btn" id="backBtn" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><div class="avatar" id="chatAvatar">V</div><div class="chat-title"><strong id="chatName">Discussion</strong><span><i class="online-dot"></i><span id="chatPresence">discussion</span></span></div><div class="chat-actions"><button class="glass-btn" title="Appel audio" aria-label="Appel audio"><svg viewBox="0 0 24 24"><path d="M7.5 4.5 10 7l-1.7 2.5a12.2 12.2 0 0 0 6.7 6.7l2.5-1.7 2.5 2.5-1.5 2.5c-.5.8-1.5 1.1-2.4.8A17.2 17.2 0 0 1 4.4 7.1c-.3-.9 0-1.9.8-2.4z"/></svg></button><button class="glass-btn" title="Appel vidéo" aria-label="Appel vidéo"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg></button></div></header>
        <div class="messages" id="messages"></div>
        <form class="composer" id="messageForm"><button type="button" class="composer-btn" id="emojiBtn" title="Emoji" aria-label="Emoji"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9h.01M15 9h.01"/></svg></button><input id="messageInput" maxlength="2000" placeholder="Écrire un message…" autocomplete="off"><button type="button" class="composer-btn" id="attachBtn" title="Joindre un fichier" aria-label="Joindre un fichier"><svg viewBox="0 0 24 24"><path d="m15.5 7.5-6.7 6.7a3 3 0 0 0 4.2 4.2l6-6a4.5 4.5 0 0 0-6.4-6.4l-6.4 6.4a6 6 0 1 0 8.5 8.5l5-5"/></svg></button><button class="send-btn" type="submit" aria-label="Envoyer"><svg viewBox="0 0 24 24"><path d="m5 4 15 8-15 8 3-8z"/></svg></button></form>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div><input type="file" id="fileInput" hidden>
  <script type="module" src="firebase-client.js"></script><script type="module" src="auth-ui.js"></script><script type="module" src="app.js"></script><script type="module" src="vibe-fixes.js"></script><script type="module" src="active-users.js"></script><script type="module" src="vibe-settings.js"></script><script type="module" src="webrtc-calls.js"></script>
</body></html>
